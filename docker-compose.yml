# Runs the Next.js app container with DATABASE_URL from .env.local.
#
#   npm run app:up      # build (first time) + start, detached
#   npm run app:down    # stop + remove the container
#
services:
  web:
    build:
      context: .
    image: trainor-web
    container_name: trainor_web
    # Host port is configurable so the container can coexist with a local
    # `next dev` on 3000. Override with WEB_PORT (e.g. WEB_PORT=3001 npm run app:up).
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Runtime secrets/keys come from .env.local.
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
